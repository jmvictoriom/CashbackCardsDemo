name: CashbackCardsDemo
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  CashbackCardsDemo:
    type: application
    platform: iOS
    sources:
      - path: CashbackCardsDemo
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.CashbackCardsDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  CashbackCardsDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CashbackCardsDemoTests
    dependencies:
      - target: CashbackCardsDemo
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.CashbackCardsDemoTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CashbackCardsDemo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CashbackCardsDemo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CashbackCardsDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CashbackCardsDemoUITests
    dependencies:
      - target: CashbackCardsDemo
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.CashbackCardsDemoUITests
        TEST_TARGET_NAME: CashbackCardsDemo
